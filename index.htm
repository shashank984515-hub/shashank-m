<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Images</title>
    <style>
        :root {
            --bg1: #081b1a;
            --bg2: #123d31;
            --card: rgba(255, 255, 255, 0.08);
            --card-border: rgba(255, 255, 255, 0.12);
            --text: #edfdf7;
            --muted: #bfdccc;
            --shadow: rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg1), var(--bg2));
            color: var(--text);
        }

        .hero {
            text-align: center;
            padding: 64px 24px 18px;
        }

        .eyebrow {
            margin: 0 0 12px;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            font-size: 0.8rem;
            color: var(--muted);
        }

        h1 {
            margin: 0;
            font-size: clamp(2.2rem, 5vw, 4rem);
            font-weight: 800;
        }

        .gallery {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px 20px 60px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 22px;
        }

        .card {
            background: var(--card);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            overflow: hidden;
            box-shadow: 0 18px 38px var(--shadow);
            backdrop-filter: blur(10px);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }

        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 26px 42px rgba(0, 0, 0, 0.35);
        }

        .card img {
            display: block;
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.35s ease;
        }

        .card:hover img {
            transform: scale(1.05);
        }

        .caption {
            padding: 16px 18px 20px;
            font-size: 1.02rem;
            color: var(--text);
        }
    </style>
</head>
<body>
    <header class="hero">
        <p class="eyebrow">Find peace in nature</p>
        <h1>Nature Images</h1>
    </header>

    <main class="gallery">
        <figure class="card">
            <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=900&q=80" alt="Mountain lake landscape">
            <figcaption class="caption">Mountain Lake</figcaption>
        </figure>

        <figure class="card">
            <img src="https://images.unsplash.com/photo-1473448912268-2022ce9509d8?auto=format&fit=crop&w=900&q=80" alt="Forest waterfall">
            <figcaption class="caption">Forest Waterfall</figcaption>
        </figure>

        <figure class="card">
            <img src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e?auto=format&fit=crop&w=900&q=80" alt="Green forest trail">
            <figcaption class="caption">Green Forest Trail</figcaption>
        </figure>

        <figure class="card">
            <img src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?auto=format&fit=crop&w=900&q=80" alt="Sunrise over mountain valley">
            <figcaption class="caption">Sunrise Valley</figcaption>
        </figure>

        <figure class="card">
            <img src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=900&q=80" alt="River in the mountains">
            <figcaption class="caption">River in the Wild</figcaption>
        </figure>

        <figure class="card">
            <img src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=900&q=80" alt="Countryside with greenery and sun">
            <figcaption class="caption">Countryside Bloom</figcaption>
        </figure>
    </main>
</body>
</html>
